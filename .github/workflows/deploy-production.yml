name: Deploy Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/dependabot.yml'
      - '.github/pull_request_template.md'

  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Force deploy Backend to GCP (ignores change detection)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  GCP_REGION: 'us-central1'
  GCP_SERVICE_NAME: 'nuroo-backend'
  PRODUCTION_CORS_ORIGIN: 'https://usenuroo.com,https://www.usenuroo.com'

jobs:
  # ── Gate: fast typecheck before spending any GCP resources ──────────────────

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Setup Node.js (backend)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck

  # ── Detect which parts of the repo changed ──────────────────────────────────

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    needs: ci-gate
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'

  # ── Backend: Build → Push → Deploy to Cloud Run ─────────────────────────────

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [ci-gate, detect-changes]
    if: |
      needs.detect-changes.outputs.backend == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_backend == true)
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set GCP Project ID
        run: echo "GCP_PROJECT_ID=$(gcloud config get-value project -q)" >> $GITHUB_ENV

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker Image
        working-directory: backend
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/nuroo/${{ env.GCP_SERVICE_NAME }}"
          docker build \
            --tag "${IMAGE}:${{ github.sha }}" \
            --tag "${IMAGE}:latest" \
            --cache-from "${IMAGE}:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .

      - name: Push Docker Image
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/nuroo/${{ env.GCP_SERVICE_NAME }}"
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.GCP_SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/nuroo/${{ env.GCP_SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=10
            --timeout=60s
            --concurrency=80
          env_vars: |
            NODE_ENV=production
            CORS_ORIGIN=${{ env.PRODUCTION_CORS_ORIGIN }}
            GIT_SHA=${{ github.sha }}
          env_vars_update_strategy: merge
          secrets: |
            FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest
            FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest
            FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest
            FIREBASE_STORAGE_BUCKET=FIREBASE_STORAGE_BUCKET:latest
          secrets_update_strategy: merge

      - name: Health check (with retry)
        run: |
          URL="${{ steps.deploy.outputs.url }}/health"
          echo "Checking $URL"
          for i in 1 2 3 4 5; do
            sleep $(( i * 5 ))
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "Health check passed."
              exit 0
            fi
          done
          echo "Health check failed after 5 attempts."
          exit 1

      - name: Output deployed URL
        run: echo "Backend deployed → ${{ steps.deploy.outputs.url }}"

  # ── Summary ─────────────────────────────────────────────────────────────────

  notify:
    name: Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-backend]
    if: always()
    steps:
      - name: Write job summary
        run: |
          echo "## Production Deploy — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend  | Deployed by Vercel |" >> $GITHUB_STEP_SUMMARY

          BACKEND="${{ needs.deploy-backend.result }}"
          if   [ "$BACKEND" = "success" ];  then echo "| Backend   | Deployed ✓ |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BACKEND" = "skipped" ];  then echo "| Backend   | Skipped (no changes) |" >> $GITHUB_STEP_SUMMARY
          else                                   echo "| Backend   | Failed ✗ |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify Slack on failure
        if: needs.deploy-backend.result == 'failure'
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e
        with:
          payload: |
            {
              "text": "Production deployment failed for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Failed* :x:\n\nRepo: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: `${{ github.sha }}`\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
